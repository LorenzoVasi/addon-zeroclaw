# Minimal standalone nginx config (no /etc/nginx/conf.d includes) — nginx
# sits between Home Assistant's Ingress iframe and ZeroClaw's own gateway
# for two reasons, both confirmed against a real Home Assistant instance and
# documented in docs/DECISIONS.md:
#
# 1. ZeroClaw hardcodes `x-frame-options: DENY` and a CSP with
#    `frame-ancestors 'none'` (crates/zeroclaw-gateway/src/security_headers.rs),
#    no config toggle — that alone blocks the Ingress iframe outright.
#    Fixed below with `proxy_hide_header`.
#
# 2. ZeroClaw's dashboard has TWO independent, unrelated base-path
#    mechanisms, and needs help with both under Ingress's dynamic
#    `/api/hassio_ingress/<token>/` subpath (confirmed by downloading and
#    grepping the actual compiled bundle, not guessed):
#
#    a) Static assets (`/_app/...`) are hardcoded absolute paths straight
#       in the served HTML (`href="/_app/logo.png"`, module `<script src=
#       "/_app/assets/...">`) — these are baked in at ZeroClaw's own build
#       time and can't be runtime-aware at all. Fixed by rewriting the
#       known `/_app/` prefix (both HTML double-quoted and JS backtick
#       forms) to prepend the `X-Ingress-Path` header Home Assistant's
#       Ingress proxy sends for exactly this purpose.
#
#    b) Backend API/pairing calls (`/api/*`, `/admin/*`, `/health`, `/pair/
#       code`) go through ZeroClaw's own runtime base-path variable: a
#       module-scoped `s = (window.__ZEROCLAW_BASE__ ?? "").replace(/\/+$/,
#       "")`, read once at module init. ZeroClaw already built this
#       specifically to support non-root deployments (it also branches on
#       `"__TAURI__" in window` for the desktop app) — it's simply never
#       populated by anything in a plain browser deployment. Fixed by
#       injecting `window.__ZEROCLAW_BASE__` as an inline <script>, set
#       to the Ingress path, before ZeroClaw's own bundle runs. This is
#       the *intended* mechanism, not a workaround — once `s` has the
#       right value, ZeroClaw's own code (its `p()` API helper and every
#       direct `${s}/...` fetch) prefixes correctly on its own.
#
#       One exception found by exhaustively grepping every literal fetch()
#       target in the compiled bundle: `fetch(\`/admin/paircode\`)` (the
#       GET-status check, as opposed to `/admin/paircode/new`) is called
#       with NO `${s}` prefix at all — looks like a gap in ZeroClaw's own
#       code, not something `__ZEROCLAW_BASE__` can fix. Given a single,
#       explicit exact-literal rewrite below.
#
#       Do NOT add broad rewrite rules for `/api/`, `/admin/`, `/health`,
#       etc. on top of the `__ZEROCLAW_BASE__` injection — an earlier
#       version of this file did, and it double-prefixed every call that
#       goes through ZeroClaw's own `p()` helper (which already adds `s`
#       itself) as soon as `__ZEROCLAW_BASE__` started being populated.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    client_max_body_size 25m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 42617;

        location / {
            proxy_pass http://127.0.0.1:8099;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (ZeroClaw's dashboard/gateway use it for
            # /ws/chat and friends).
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Fix 1: drop ZeroClaw's hardcoded anti-framing headers before
            # they reach the browser. Everything else about the response
            # passes through unchanged.
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;

            # Fix 2a: static asset base path (see header comment). ZeroClaw
            # serves its JS chunks as `text/javascript`, not
            # `application/javascript` — both are listed defensively since
            # sub_filter_types requires an exact Content-Type match.
            sub_filter_types text/html application/javascript text/javascript text/css;
            sub_filter_once off;
            sub_filter '"/_app/' '"$http_x_ingress_path/_app/';
            sub_filter '`/_app/' '`$http_x_ingress_path/_app/';

            # Fix 2b: give ZeroClaw's own runtime base-path variable the
            # value it needs. Inserted right after <head> so it runs before
            # ZeroClaw's module script (module scripts are deferred by the
            # HTML spec, but there's no reason to rely on that ordering
            # when this is just as easy to place first).
            sub_filter '<head>' '<head><script>window.__ZEROCLAW_BASE__="$http_x_ingress_path";</script>';

            # Fix 2c: the one confirmed exception — see header comment.
            # Exact literal match (both backticks), so this can never
            # collide with the unrelated `/admin/paircode/new` endpoint.
            sub_filter '`/admin/paircode`' '`$http_x_ingress_path/admin/paircode`';

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
