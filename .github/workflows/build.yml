name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  boot-test:
    # Single-arch (amd64, the runner's native arch — no QEMU emulation, so
    # this stays fast) build-and-boot smoke test: catches a container that
    # builds fine but fails at runtime (a broken run.sh, a bad nginx.conf,
    # a boot-sequence regression) — the kind of bug `docker build` alone
    # never surfaces, which is exactly why this project's own working
    # method (see docs/DECISIONS.md, CLAUDE.md) has been "verify against a
    # real running container" for every change to run.sh/Dockerfile/
    # nginx.conf rather than trusting a successful build. This job
    # automates that same check on every push/PR instead of relying on it
    # being done by hand every time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t zeroclaw-addon-boot-test -f Dockerfile .

      - name: Boot with a fake options.json and wait for /health
        run: |
          set -euo pipefail
          mkdir -p /tmp/zc-boot-test/data
          # Exercises the paths that actually differ per option: a cloud
          # provider, a self-hosted one (the only kind that gets
          # `chat_template_kwargs`), and the webhook secret.
          cat > /tmp/zc-boot-test/options.json <<'EOF'
          {
            "log_level": "info",
            "api_token": "ci-smoke-test-token",
            "webhook_secret": "ci-webhook-secret",
            "home_assistant_url": "",
            "home_assistant_token": "",
            "providers": [
              {"provider_type": "anthropic", "alias": "cloud",
               "api_key": "sk-ant-fake", "model": "claude-sonnet-4-5"},
              {"provider_type": "ollama", "alias": "local", "model": "llama3"}
            ]
          }
          EOF
          docker run -d --name zc-boot-test \
            -v /tmp/zc-boot-test/options.json:/data/options.json:ro \
            -v /tmp/zc-boot-test/data:/data/zeroclaw \
            zeroclaw-addon-boot-test

          for i in $(seq 1 45); do
            if docker exec zc-boot-test curl -sf -m 2 http://127.0.0.1:8099/health >/dev/null 2>&1; then
              echo "Healthy after ${i}s."
              exit 0
            fi
            sleep 1
          done

          echo "::error::Container never became healthy within 45s."
          exit 1

      # Booting proves run.sh didn't crash; it does not prove run.sh did
      # anything. Every assertion below corresponds to a bug that has
      # actually shipped from this repo or a silent no-op found while
      # testing — see docs/DECISIONS.md.
      - name: Assert the boot sequence actually seeded what it claims
        run: |
          set -euo pipefail
          cfg="$(docker exec zc-boot-test cat /data/zeroclaw/.zeroclaw/config.toml)"

          fail() { echo "::error::$1"; echo "--- config.toml ---"; echo "${cfg}"; exit 1; }

          # `live_pricing` belongs on every provider; `chat_template_kwargs`
          # only on the chat-template-aware (self-hosted) ones, since a
          # cloud provider never reads it.
          echo "${cfg}" | grep -q '^\[providers.models.anthropic.cloud\]' \
            || fail "the anthropic provider block was not seeded"
          echo "${cfg}" | grep -q '^\[providers.models.ollama.local\]' \
            || fail "the ollama provider block was not seeded"
          [ "$(echo "${cfg}" | grep -c '^live_pricing = true$')" -eq 2 ] \
            || fail "live_pricing was not seeded for both providers"
          [ "$(echo "${cfg}" | grep -c '^chat_template_kwargs = ')" -eq 1 ] \
            || fail "chat_template_kwargs should be on the self-hosted provider only"

          # First-boot memory defaults. `redact_on_write` lives under
          # [memory.policy], not [memory] — getting that wrong is a silent
          # "Unknown property" that only shows up in the log.
          for line in \
            'snapshot_enabled = true' \
            'snapshot_on_hygiene = true' \
            'dedup_on_write = true' \
            'auto_save = false' \
            'response_cache_enabled = true' \
            'redact_on_write = true'; do
            echo "${cfg}" | grep -q "^${line}$" || fail "memory default missing: ${line}"
          done

          # A `config set` that reports success but writes nothing is a
          # real failure mode here (see docs/DECISIONS.md on
          # gateway.webhook_secret), so check the daemon's own view rather
          # than the CLI's word for it.
          populated="$(docker exec zc-boot-test curl -s \
            -H 'Authorization: Bearer ci-smoke-test-token' \
            'http://127.0.0.1:8099/api/config/prop?path=gateway.webhook_secret')"
          case "${populated}" in
            *'"populated":true'*) ;;
            *) fail "gateway.webhook_secret is not live: ${populated}" ;;
          esac

          # And that it is genuinely enforced, not merely present.
          code="$(docker exec zc-boot-test curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:8099/webhook \
            -H 'Authorization: Bearer ci-smoke-test-token' \
            -H 'Content-Type: application/json' -d '{"message":"x"}')"
          [ "${code}" = "401" ] \
            || fail "/webhook accepted a call with no X-Webhook-Secret (got ${code})"

          echo "All boot-sequence assertions passed."

      - name: Container logs (always, for debugging a failure above)
        if: always()
        run: docker logs zc-boot-test || true

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # `github.repository` preserves case (`LorenzoVasi/addon-zeroclaw`),
      # but Docker/GHCR image references must be all-lowercase — GitHub
      # Actions expressions have no built-in lower() function, so this has
      # to be a shell step, not an `env:` expression (confirmed the hard
      # way: `docker buildx build` failing with "repository name must be
      # lowercase" on the first real push to this repo).
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build-only on PRs (no registry credentials needed); push on branch/tag
      # events once this repo's GHCR namespace is finalized.
      - name: Build (amd64 + aarch64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/aarch64
          push: false

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + aarch64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/aarch64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
